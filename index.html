<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bölünebility | Serhat Kiraz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Bölünebility</h1>
<p class="subtitle">Number Range Analysis Tool</p>

<div class="card">

  <div class="grid">
    <input id="min" type="number" placeholder="Start Number">
    <input id="max" type="number" placeholder="End Number">
  </div>

  <div class="grid">
    <input id="divisor" type="number" placeholder="Divisible By">
    <button onclick="calculateDivisible()">Calculate</button>
  </div>

  <div class="grid">
    <input id="num1" type="number" placeholder="First Number">
    <input id="num2" type="number" placeholder="Second Number">
    <button onclick="commonDivisorsRange()">Common Divisible</button>
  </div>

  <div class="actions">
    <button onclick="primeNumbers()">Prime</button>
    <button onclick="squareNumbers()">Square</button>
    <button onclick="cubeNumbers()">Cube</button>
  </div>

  <div class="toolbar">
    <span id="resultCount">0 results</span>

    <div>
      <button onclick="copyResults()">Copy</button>
      <button onclick="clearAll()">Reset</button>
    </div>
  </div>

  <div id="result" class="result">
    Results will appear here.
  </div>

</div>

<footer>
  <a href="https://serhatkiraz.github.io/" target="_blank">
    Serhat Kiraz
  </a>
</footer>

<script src="script.js"></script>
</body>
</html>
