<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Bölünebility | Serhat Kiraz</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<h1>Bölünebility</h1>
<p class="subtitle">
  Number Range Analysis Tool
</p>

<div class="card">

  <div class="grid">
    <input
      id="min"
      type="text"
      inputmode="numeric"
      placeholder="Start Number"
      autocomplete="off"
    >

    <input
      id="max"
      type="text"
      inputmode="numeric"
      placeholder="End Number"
      autocomplete="off"
    >
  </div>

  <div class="grid">
    <input
      id="divisor"
      type="text"
      inputmode="numeric"
      placeholder="Divisible By"
      autocomplete="off"
    >

    <button
      type="button"
      onclick="calculateDivisible()"
    >
      Calculate Divisible
    </button>
  </div>

  <div class="grid">
    <input
      id="num1"
      type="text"
      inputmode="numeric"
      placeholder="First Number"
      autocomplete="off"
    >

    <input
      id="num2"
      type="text"
      inputmode="numeric"
      placeholder="Second Number"
      autocomplete="off"
    >

    <button
      type="button"
      onclick="commonDivisorsRange()"
    >
      Common Divisible
    </button>
  </div>

  <div class="actions">

    <button
      type="button"
      onclick="primeNumbers()"
    >
      Prime Numbers
    </button>

    <button
      type="button"
      onclick="squareNumbers()"
    >
      Square Numbers
    </button>

    <button
      type="button"
      onclick="cubeNumbers()"
    >
      Cube Numbers
    </button>

  </div>

  <div class="toolbar">

    <span id="resultCount">
      0 results
    </span>

    <div>

      <button
        type="button"
        onclick="copyResults()"
      >
        Copy
      </button>

      <button
        type="button"
        onclick="clearAll()"
      >
        Reset
      </button>

    </div>

  </div>

  <div
    id="result"
    class="result"
  >
    Results will appear here.
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
