<body>

<h1>Bölünebility</h1>
<p class="subtitle">Number Range Analysis Tool</p>

<div class="card">

  <div class="grid">
    <input id="min" placeholder="Start Number">
    <input id="max" placeholder="End Number">
  </div>

  <div class="grid">
    <input id="divisor" placeholder="Divisible By">
    <button onclick="calculateDivisible()">
      Calculate Divisible
    </button>
  </div>

  <div class="grid">
    <input id="num1" placeholder="First Number">
    <input id="num2" placeholder="Second Number">
    <button onclick="commonDivisorsRange()">
      Common Divisible
    </button>
  </div>

  <div class="actions">
    <button onclick="primeNumbers()">
      Prime Numbers
    </button>

    <button onclick="squareNumbers()">
      Square Numbers
    </button>

    <button onclick="cubeNumbers()">
      Cube Numbers
    </button>
  </div>

  <div class="toolbar">
    <span id="resultCount">
      0 results
    </span>

    <div>
      <button onclick="copyResults()">
        Copy
      </button>

      <button onclick="clearAll()">
        Reset
      </button>
    </div>
  </div>

  <div id="result" class="result">
    Results will appear here.
  </div>

</div>

<script src="script.js"></script>

</body>
