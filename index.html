<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bölünebility | Serhat Kiraz</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<header>

  <h1>Bölünebility</h1>

  <p class="subtitle">
    Number Range Analysis Tool
  </p>

</header>

<main class="card">

  <section class="range-grid">

    <input
      id="min"
      type="text"
      inputmode="numeric"
      placeholder="Start Number"
      autocomplete="off"
    >

    <input
      id="max"
      type="text"
      inputmode="numeric"
      placeholder="End Number"
      autocomplete="off"
    >

  </section>

  <section class="divisible-grid">

    <input
      id="divisor"
      type="text"
      inputmode="numeric"
      placeholder="Divisible By"
      autocomplete="off"
    >

    <button
      id="btnDivisible"
      type="button"
      onclick="calculateDivisible()"
    >
      Divisible
    </button>

  </section>

  <section class="common-grid">

    <input
      id="num1"
      type="text"
      inputmode="numeric"
      placeholder="First Number"
      autocomplete="off"
    >

    <input
      id="num2"
      type="text"
      inputmode="numeric"
      placeholder="Second Number"
      autocomplete="off"
    >

    <button
      id="btnCommon"
      type="button"
      onclick="commonDivisorsRange()"
    >
      Common
    </button>

  </section>

  <section class="actions">

    <button
      id="btnPrime"
      type="button"
      onclick="primeNumbers()"
    >
      Prime
    </button>

    <button
      id="btnSquare"
      type="button"
      onclick="squareNumbers()"
    >
      Square
    </button>

    <button
      id="btnCube"
      type="button"
      onclick="cubeNumbers()"
    >
      Cube
    </button>

  </section>

  <section class="status-bar">

    <div class="left-status">

      <span id="resultCount">
        0 results
      </span>

      <span
        id="loading"
        class="hidden"
      >
        Calculating...
      </span>

    </div>

    <div class="right-status">

      <span
        id="progress"
        class="hidden"
      >
        0%
      </span>

      <button
        id="copyBtn"
        type="button"
        onclick="copyResults()"
      >
        Copy
      </button>

      <button
        id="resetBtn"
        type="button"
        onclick="clearAll()"
      >
        Reset
      </button>

    </div>

  </section>

  <section
    id="result"
    class="result"
  >
    Results will appear here.
  </section>

</main>

<script src="script.js"></script>

</body>
</html>
